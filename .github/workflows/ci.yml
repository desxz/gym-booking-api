name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Generate mocks
        run: |
          go generate ./...
          git diff --exit-code

      - name: Production dependency purity
        run: |
          if go list -deps ./cmd/api | grep -E 'testify|uber\.org/mock|testcontainers'; then
            echo "test-only dependency leaked into the production binary" >&2
            exit 1
          fi

      - name: Coverage gate (100.0% required on core packages)
        run: |
          go test -short -race -coverprofile=coverage.out ./internal/domain ./internal/auth ./internal/config ./internal/service ./internal/httpapi
          go tool cover -func=coverage.out | tee coverage.txt
          grep -q 'total:.*100.0%' coverage.txt

      - name: Test (unit, HTTP, and Testcontainers integration)
        run: go test -race -shuffle=on -v ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...
