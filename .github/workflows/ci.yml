name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Generate mocks
        run: make generate-check

      - name: Format
        run: make fmt

      - name: Vet
        run: make vet

      - name: Production dependency purity
        run: make check-prod-deps

      - name: Coverage gate
        run: make cover

      - name: Flakiness
        run: make test-flake

      - name: Integration tests
        run: make test-integration

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: make vuln
