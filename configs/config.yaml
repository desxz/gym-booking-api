http:
  addr: ":8080"
  read_header_timeout: 3s
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  request_timeout: 5s
  shutdown_timeout: 15s
  shutdown_drain_delay: 0s
  max_body_bytes: 1048576

database:
  host: "localhost"
  port: 5432
  name: "gym_booking"
  user: "gym_app"
  ssl_mode: "disable"
  max_conns: 15
  min_conns: 2
  connect_timeout: 5s
  statement_timeout: 3s
  lock_timeout: 2s
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  rollback_timeout: 2s
  ready_ping_timeout: 2s

auth:
  jwt_issuer: "gym-booking-api"
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  bcrypt_cost: 12
